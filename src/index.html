<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Le Souffle Océanique — Yoga de l'Énergie à Labenne</title>
  <meta name="description" content="Yoga de l'Énergie, souffle, son et mouvement à Labenne. Cours adultes, enfants et ados, méditation, yoga du son, massages sonores aux bols chantants, ateliers et cérémonies de passage, avec Émilie Gavart.">
  <link rel="canonical" href="https://le-souffle-oceanique-yoga.vercel.app/">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!--
    Balises Open Graph / Twitter Card STATIQUES et génériques.
    Le site n'a pas de rendu serveur (SSR) : une seule page HTML (celle-ci)
    est servie pour toutes les URLs, le contenu réel est ensuite injecté par
    Angular en JavaScript. Les robots qui génèrent les aperçus de lien
    (Facebook, Instagram, LinkedIn, WhatsApp...) n'exécutent pas ce
    JavaScript et ne liront donc toujours QUE ce qui est écrit ici, quelle
    que soit la page partagée. D'où ce choix : un aperçu correct et
    identique pour tout le site, plutôt qu'un aperçu par page qui
    nécessiterait du SSR pour fonctionner. Google, lui, exécute le
    JavaScript et voit en plus les balises mises à jour par page
    (src/app/shared/seo/seo.service.ts).
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Le Souffle Océanique">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:url" content="https://le-souffle-oceanique-yoga.vercel.app/">
  <meta property="og:title" content="Le Souffle Océanique — Yoga de l'Énergie à Labenne">
  <meta property="og:description" content="Yoga de l'Énergie, souffle, son et mouvement à Labenne. Cours adultes, enfants et ados, méditation, yoga du son, massages sonores aux bols chantants, avec Émilie Gavart.">
  <meta property="og:image" content="https://le-souffle-oceanique-yoga.vercel.app/assets/images/logo.jpg">
  <meta property="og:image:width" content="484">
  <meta property="og:image:height" content="500">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Le Souffle Océanique — Yoga de l'Énergie à Labenne">
  <meta name="twitter:description" content="Yoga de l'Énergie, souffle, son et mouvement à Labenne, avec Émilie Gavart.">
  <meta name="twitter:image" content="https://le-souffle-oceanique-yoga.vercel.app/assets/images/logo.jpg">

  <!-- Polices auto-hébergées (voir styles.css) : plus de requête vers Google
       Fonts. Préchargement du corps de texte (la police la plus utilisée,
       présente dès le premier écran) pour limiter le texte invisible le
       temps du chargement. -->
  <link rel="preload" href="assets/fonts/futura-std-book.woff2" as="font" type="font/woff2" crossorigin>
</head>

</body>
