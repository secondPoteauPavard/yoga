<header class="site-header" [class.menu-open]="menuOpen()">
  <div class="container bar">
    <a routerLink="/" class="brand" (click)="closeMenu()">
      <img src="assets/images/logo.jpg" alt="Le Souffle Océanique" class="brand-logo" />
      <span class="brand-name">Le Souffle Océanique</span>
    </a>

    <button
      type="button"
      class="burger"
      [class.is-open]="menuOpen()"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-nav"
      aria-label="Ouvrir le menu"
    >
      <span></span><span></span><span></span>
    </button>

    <nav id="main-nav" class="nav" [class.nav--open]="menuOpen()">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="is-active" (click)="closeMenu()">{{ link.label }}</a>
      }
      <a routerLink="/contact" class="btn btn--primary nav-cta" (click)="closeMenu()">Contact / Inscription</a>
    </nav>
  </div>
</header>
